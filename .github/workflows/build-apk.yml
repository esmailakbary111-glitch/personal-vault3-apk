name: Build Personal Vault APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v7

      - name: Find and extract Personal Vault project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$(find . -maxdepth 1 -type f -name 'personal-vault-android*.zip' -print -quit)"
          if [ -z "${ARCHIVE}" ]; then
            echo "ERROR: personal-vault-android ZIP file was not found in the repository root."
            echo "Upload the personal-vault-android-github.zip file first."
            exit 1
          fi

          rm -rf .ci-project
          mkdir -p .ci-project
          unzip -q "${ARCHIVE}" -d .ci-project

          test -f .ci-project/personal-vault-android/android/settings.gradle
          test -f .ci-project/personal-vault-android/android/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Build debug APK
        working-directory: .ci-project/personal-vault-android/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: test -f .ci-project/personal-vault-android/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-vault-apk
          path: .ci-project/personal-vault-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
